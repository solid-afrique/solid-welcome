<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLID SA — Bienvenue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a2540;
    --navy-2:#0f3a63;
    --blue:#1565c0;
    --blue-light:#4a9be0;
    --sky:#eaf3fc;
    --paper:#fdfbf6;
    --paper-2:#f4efe4;
    --ink:#182636;
    --muted:#5c6b7a;
    --line:rgba(10,37,64,0.12);
    --shadow-lg:0 40px 90px rgba(5,18,32,0.55);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    min-height:100vh;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(74,155,224,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(21,101,192,0.20), transparent 50%),
      linear-gradient(160deg,#071b30 0%, #0a2540 55%, #0f3a63 100%);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow-x:hidden;
  }

  .app{width:100%;max-width:960px;position:relative;}

  .screen{display:none;}
  .screen.active{display:block;animation:riseIn .7s ease both;}

  @keyframes riseIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  .africa-mark{
    position:absolute;
    opacity:0.08;
    filter:drop-shadow(0 0 30px rgba(74,155,224,0.4));
    pointer-events:none;
  }

  #formScreen{display:flex;justify-content:center;}

  .card{
    position:relative;
    width:100%;
    max-width:480px;
    background:linear-gradient(180deg,#ffffff, var(--sky));
    border-radius:22px;
    padding:52px 44px 44px;
    box-shadow:var(--shadow-lg);
    overflow:hidden;
    text-align:center;
  }

  .card .africa-mark{width:340px;height:340px;right:-90px;top:-70px;color:var(--blue);}

  .brandmark{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:22px;
  }
  .brandmark::before,.brandmark::after{
    content:'';
    width:26px;height:1px;
    background:var(--blue-light);
  }

  h1.card-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,4vw,36px);
    line-height:1.15;
    color:var(--navy);
    margin-bottom:14px;
  }

  .card-sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    max-width:360px;
    margin:0 auto 34px;
  }

  form{position:relative;z-index:1;}

  .field{
    text-align:left;
    margin-bottom:18px;
  }

  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--navy-2);
    margin-bottom:8px;
  }

  .field input{
    width:100%;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-size:15.5px;
    color:var(--ink);
    background:#fff;
    transition:border-color .25s ease, box-shadow .25s ease;
  }

  .field input:focus{
    outline:none;
    border-color:var(--blue-light);
    box-shadow:0 0 0 4px rgba(74,155,224,0.18);
  }

  .submit-btn{
    width:100%;
    margin-top:14px;
    padding:15px 20px;
    border:none;
    border-radius:12px;
    background:linear-gradient(120deg,var(--blue) 0%, var(--blue-light) 100%);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.03em;
    cursor:pointer;
    box-shadow:0 14px 30px rgba(21,101,192,0.35);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(21,101,192,0.45);}
  .submit-btn:active{transform:translateY(0);}

  .hint-error{
    display:none;
    color:#c0392b;
    font-size:12.5px;
    margin-top:-8px;
    margin-bottom:14px;
    text-align:left;
  }
  .hint-error.show{display:block;}

  #bookScreen{display:flex;flex-direction:column;align-items:center;}

  .book-stage{
    position:relative;
    width:100%;
    max-width:860px;
    perspective:2600px;
  }

  /* ---- Couverture fermée, affichée avant l'ouverture du livre ---- */
  .book-cover{
    position:absolute;
    inset:0;
    z-index:30;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 55%,#0a2d4d 100%);
    box-shadow:var(--shadow-lg), 6px 0 40px rgba(0,0,0,0.45);
    transform-origin:left center;
    transform-style:preserve-3d;
    backface-visibility:hidden;
  }

  .book-cover .africa-mark{
    width:55%;height:55%;left:22%;top:20%;
    color:var(--blue-light);opacity:0.14;
  }

  .book-cover .cover-inner{position:relative;z-index:1;padding:0 30px;}

  .book-cover .cover-eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--blue-light);
    margin-bottom:18px;
  }

  .book-cover .cover-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,4.4vw,40px);
    color:#fdfbf6;
    line-height:1.2;
  }

  .book-cover .cover-sub{
    margin-top:14px;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:15px;
    color:var(--blue-light);
  }

  @keyframes openCover{
    0%{transform:rotateY(0deg);filter:brightness(1);}
    100%{transform:rotateY(-172deg);filter:brightness(0.85);}
  }
  .book-cover.opening{
    animation:openCover 4s cubic-bezier(.6,0,.3,1) forwards;
  }

  @media (prefers-reduced-motion:reduce){
    .book-cover.opening{animation:none;}
  }

  .book-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    border-radius:10px;
    display:flex;
    background:#0e1f33;
    box-shadow:var(--shadow-lg);
    overflow:hidden;
  }

  .book-spine{
    position:absolute;
    left:50%;top:0;bottom:0;
    width:8px;
    transform:translateX(-4px);
    background:linear-gradient(90deg, rgba(0,0,0,0.35), rgba(0,0,0,0.06) 30%, rgba(0,0,0,0.06) 70%, rgba(0,0,0,0.35));
    z-index:20;
    pointer-events:none;
  }

  .page-half{
    position:relative;
    width:50%;
    height:100%;
    padding:44px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:linear-gradient(160deg,var(--paper), var(--paper-2));
    overflow:hidden;
  }

  .page-left{
    border-radius:10px 0 0 10px;
    box-shadow:inset -14px 0 26px -18px rgba(10,20,32,0.55);
  }

  .page-right{
    border-radius:0 10px 10px 0;
    box-shadow:inset 14px 0 26px -18px rgba(10,20,32,0.55);
    transform-origin:left center;
    backface-visibility:hidden;
  }

  .page-right.flipping{
    animation:flipRight 1.1s cubic-bezier(.4,.7,.3,1) both;
  }

  @keyframes flipRight{
    0%{transform:rotateY(0deg);filter:brightness(1);}
    48%{transform:rotateY(-92deg);filter:brightness(0.72);}
    52%{transform:rotateY(-92deg);filter:brightness(0.72);}
    100%{transform:rotateY(0deg);filter:brightness(1);}
  }

  .page-content{transition:opacity .35s ease;}

  .page-half .africa-mark{width:65%;height:65%;left:17%;top:17%;color:var(--blue);}

  @media (prefers-reduced-motion:reduce){
    .page-right.flipping{animation:none;}
  }

  /* --- Responsive tablette et mobile --- */
  @media (max-width:768px){
    .card{padding:40px 28px 34px;border-radius:18px;}
    .book-stage{max-width:100%;}
    .book-frame{aspect-ratio:3/4;}
    .book-spine{left:0;right:0;top:50%;bottom:auto;width:auto;height:8px;
      background:linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.06) 30%, rgba(0,0,0,0.06) 70%, rgba(0,0,0,0.35));
      transform:translateY(-4px);
    }
    .page-half{width:100%;height:50%;padding:30px 24px;}
    .page-left{border-radius:10px 10px 0 0;box-shadow:inset 0 -14px 26px -18px rgba(10,20,32,0.55);}
    .page-right{border-radius:0 0 10px 10px;box-shadow:inset 0 14px 26px -18px rgba(10,20,32,0.55);}
    .page-right.flipping{animation:fadeSwap .8s ease both;}
    @keyframes fadeSwap{0%{opacity:1;}50%{opacity:0.15;}100%{opacity:1;}}
    .book-cover{transform-origin:center top;}
    @keyframes openCoverMobile{
      0%{transform:rotateX(0deg);filter:brightness(1);}
      100%{transform:rotateX(-172deg);filter:brightness(0.85);}
    }
    .book-cover.opening{animation-name:openCoverMobile;}
    .book-controls{margin-top:16px;gap:12px;}
    .nav-btn{width:40px;height:40px;}
    .dots{gap:6px;}
    .dot{width:6px;height:6px;}
    .dot.active{width:16px;}
  }

  @media (max-width:480px){
    body{padding:8px;}
    .card{padding:28px 16px 24px;border-radius:14px;}
    .brandmark{font-size:13px;gap:6px;}
    .brandmark::before,.brandmark::after{width:18px;}
    h1.card-title{font-size:clamp(22px,5vw,28px);}
    .card-sub{font-size:13.5px;margin-bottom:24px;}
    .field input{padding:12px 14px;font-size:14px;}
    .submit-btn{padding:13px;font-size:14px;}
    .book-frame{aspect-ratio:4/5;border-radius:8px;}
    .page-half{padding:16px 14px;}
    .page-half .eyebrow{font-size:10px;margin-bottom:8px;}
    .page-half h1.wordmark{font-size:clamp(22px,5vw,28px);}
    .page-half .greeting{font-size:clamp(16px,4vw,20px);}
    .page-half p{font-size:12px;line-height:1.5;margin-top:6px;}
    .page-half .closing{font-size:13px;margin-top:10px;}
    .page-half .signature-name{font-size:clamp(16px,4vw,20px);}
    .page-half .final-note{font-size:14px;}
    .page-half .date-line{font-size:11px;margin-top:12px;}
    .page-half .team{font-size:11px;}
    .page-number{font-size:9px;bottom:8px;}
    .page-left .page-number{left:12px;}
    .page-right .page-number{right:12px;}
    .book-controls{gap:8px;margin-top:10px;}
    .nav-btn{width:32px;height:32px;}
    .nav-btn svg{width:14px;height:14px;}
    .progress-wrap{max-width:140px;}
    .dots{gap:4px;margin-bottom:6px;}
    .dot{width:5px;height:5px;}
    .dot.active{width:12px;}
    .restart-btn{padding:10px 18px;font-size:12px;}
    .festive-decorations .balloon{font-size:1.8rem;}
    .festive-decorations .confetti{font-size:1rem;}
    .festive-decorations .sparkle{font-size:0.9rem;}
  }

  @media (max-width:380px){
    .card{padding:20px 12px 18px;}
    .book-frame{aspect-ratio:4/6;}
    .page-half{padding:12px 10px;}
    .page-half p{font-size:11px;line-height:1.4;}
    .page-half .greeting{font-size:15px;}
    .page-half h1.wordmark{font-size:20px;}
    .page-half .closing{font-size:12px;}
    .page-half .final-note{font-size:13px;}
    .page-number{font-size:8px;}
    .book-controls{flex-wrap:wrap;justify-content:center;}
    .nav-btn{width:28px;height:28px;}
    .dots .dot{width:4px;height:4px;}
    .dots .dot.active{width:10px;}
  }

  .eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:16px;
  }

  .page-half h1.wordmark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px,5vw,46px);
    letter-spacing:0.02em;
    color:var(--navy);
  }

  .page-half .tagline{
    margin-top:10px;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    color:var(--blue);
  }

  .page-half .date-line{
    margin-top:22px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.02em;
  }

  .page-half .greeting{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(22px,3.4vw,28px);
    color:var(--navy);
    margin-bottom:6px;
  }

  .page-half p{
    font-size:14.5px;
    line-height:1.8;
    color:#3d4c5c;
    text-align:left;
    margin-top:14px;
  }

  .page-half .closing{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:16px;
    color:var(--blue);
    margin-top:20px;
  }

  .page-half .team{
    margin-top:10px;
    font-size:13px;
    color:var(--muted);
  }

  .page-half .signature-role{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:16px;
  }

  .page-half .signature-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(22px,3.4vw,28px);
    color:var(--blue);
  }

  .page-half .final-note{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:18px;
    color:var(--navy);
    line-height:1.6;
  }

  .page-number{
    position:absolute;
    bottom:16px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.05em;
  }
  .page-left .page-number{left:22px;}
  .page-right .page-number{right:22px;}

  .book-controls{
    width:100%;
    max-width:860px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-top:26px;
  }

  .nav-btn{
    width:44px;height:44px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);
    color:#eaf3fc;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:all .25s ease;
    flex-shrink:0;
  }
  .nav-btn:hover:not(:disabled){background:rgba(255,255,255,0.16);transform:translateY(-2px);}
  .nav-btn:disabled{opacity:0.25;cursor:not-allowed;}

  .progress-wrap{flex:1;text-align:center;}

  .dots{display:flex;justify-content:center;gap:8px;margin-bottom:10px;}
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    transition:all .3s ease;
  }
  .dot.active{background:var(--blue-light);width:20px;border-radius:4px;}

  .progress-bar{
    width:100%;max-width:260px;margin:0 auto;
    height:2px;background:rgba(255,255,255,0.15);
    border-radius:2px;overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--blue),var(--blue-light));
    transition:width .5s ease;
  }

  .restart-wrap{
    margin-top:30px;
    text-align:center;
    display:none;
  }
  .restart-wrap.show{display:block;animation:riseIn .6s ease both;}

  .restart-btn{
    padding:13px 32px;
    border-radius:30px;
    border:1.5px solid var(--blue-light);
    background:transparent;
    color:#eaf3fc;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .3s ease;
  }
  .restart-btn:hover{background:var(--blue-light);color:var(--navy);}

  /* ---- Décorations festives ---- */
  .festive-decorations{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:1000;
    overflow:hidden;
    display:none;
  }
  #bookScreen.active ~ .festive-decorations,
  .app:has(#bookScreen.active) .festive-decorations{display:block;}

  .balloon{position:absolute;font-size:2.6rem;animation:floatUp 6s ease-in-out infinite;opacity:.75;}
  .balloon-1{top:8%;left:4%;animation-delay:0s;}
  .balloon-2{top:14%;right:6%;animation-delay:1s;}
  .balloon-3{top:24%;left:12%;animation-delay:2s;}
  .balloon-4{top:18%;right:10%;animation-delay:3s;}
  .balloon-5{top:32%;left:6%;animation-delay:4s;}
  .balloon-6{top:28%;right:4%;animation-delay:5s;}
  @keyframes floatUp{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-18px) rotate(4deg);}}

  .confetti{position:absolute;font-size:1.6rem;animation:confettiFall 4.5s linear infinite;opacity:0;}
  .confetti-1{left:18%;animation-delay:0s;}
  .confetti-2{left:38%;animation-delay:1.1s;}
  .confetti-3{left:62%;animation-delay:2.2s;}
  .confetti-4{left:82%;animation-delay:3.3s;}
  @keyframes confettiFall{0%{top:-8%;opacity:1;transform:rotate(0deg);}100%{top:104%;opacity:0;transform:rotate(540deg);}}

  .sparkle{position:absolute;font-size:1.2rem;animation:sparkleBlink 2.4s ease-in-out infinite;}
  .sparkle-1{top:18%;left:28%;animation-delay:0s;}
  .sparkle-2{top:38%;left:68%;animation-delay:.5s;}
  .sparkle-3{top:58%;left:22%;animation-delay:1s;}
  .sparkle-4{top:28%;left:78%;animation-delay:1.5s;}
  .sparkle-5{top:68%;left:58%;animation-delay:2s;}
  .sparkle-6{top:48%;left:38%;animation-delay:2.5s;}
  @keyframes sparkleBlink{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
</style>
</head>
<body>

<div class="app">

  <section id="bookScreen" class="screen">
    <div class="book-stage">
      <div class="book-frame" id="bookFrame">
        <div class="book-spine"></div>
      </div>
      <div class="book-cover" id="bookCover">
        <svg class="africa-mark" viewBox="0 0 200 220" fill="currentColor" aria-hidden="true">
          <path d="M96 4c10 0 15 8 24 10 8 2 18-2 24 6 5 7 1 16 6 22 6 7 17 6 20 15 3 8-6 14-4 23 2 9 12 13 11 22-1 9-11 11-13 19-2 9 6 16 2 24-4 8-15 6-19 13-4 7 2 16-4 22-5 5-13 1-18 6-6 6-2 15-9 19-7 4-14-3-21-1-8 2-11 12-19 11-8-1-9-12-16-15-7-3-15 3-21-2-6-5-2-14-7-19-5-5-14-2-17-9-3-7 4-13 3-20-1-8-10-11-10-19 0-8 9-11 10-19 1-7-6-13-3-20 3-7 12-7 16-13 4-6-1-15 4-20 5-5 14 0 20-4 6-4 4-14 11-16 6-2 12 5 19 4 7-1 10-10 18-9z"/>
        </svg>
        <div class="cover-inner">
          <div class="cover-eyebrow">SOLID SA</div>
          <div class="cover-title">Mot de<br>bienvenue</div>
          <div class="cover-sub">Solution Informatique Durable</div>
        </div>
      </div>
    </div>

    <div class="book-controls">
      <button class="nav-btn" id="prevBtn" aria-label="Page précédente">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="progress-wrap">
        <div class="dots" id="dots"></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <button class="nav-btn" id="nextBtn" aria-label="Page suivante">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="restart-wrap" id="restartWrap">
      <button class="restart-btn" id="restartBtn">Revoir le message</button>
    </div>
  </section>

  <div class="festive-decorations" id="festiveDecorations">
    <div class="balloon balloon-1">🎈</div>
    <div class="balloon balloon-2">🎈</div>
    <div class="balloon balloon-3">🎈</div>
    <div class="balloon balloon-4">🎈</div>
    <div class="balloon balloon-5">🎈</div>
    <div class="balloon balloon-6">🎈</div>
    <div class="confetti confetti-1">🎊</div>
    <div class="confetti confetti-2">🎊</div>
    <div class="confetti confetti-3">🎊</div>
    <div class="confetti confetti-4">🎊</div>
    <div class="sparkle sparkle-1">✨</div>
    <div class="sparkle sparkle-2">✨</div>
    <div class="sparkle sparkle-3">✨</div>
    <div class="sparkle sparkle-4">✨</div>
    <div class="sparkle sparkle-5">✨</div>
    <div class="sparkle sparkle-6">✨</div>
  </div>

</div>

<script>window.SOLID_PRESET_NAME = { prenom: "Landry", nom: "SANOU", date: "09 août 2026" };</script>
<script>
(function(){
  const formScreen = document.getElementById('formScreen');
  const bookScreen = document.getElementById('bookScreen');
  const form = document.getElementById('welcomeForm');
  const formError = document.getElementById('formError');
  const dateInput = document.getElementById('dateWelcome');
  const bookFrame = document.getElementById('bookFrame');
  const bookCover = document.getElementById('bookCover');
  const dotsWrap = document.getElementById('dots');
  const progressFill = document.getElementById('progressFill');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const restartWrap = document.getElementById('restartWrap');
  const restartBtn = document.getElementById('restartBtn');

  const AFRICA_SVG = '<svg class="africa-mark" viewBox="0 0 200 220" fill="currentColor" aria-hidden="true"><path d="M96 4c10 0 15 8 24 10 8 2 18-2 24 6 5 7 1 16 6 22 6 7 17 6 20 15 3 8-6 14-4 23 2 9 12 13 11 22-1 9-11 11-13 19-2 9 6 16 2 24-4 8-15 6-19 13-4 7 2 16-4 22-5 5-13 1-18 6-6 6-2 15-9 19-7 4-14-3-21-1-8 2-11 12-19 11-8-1-9-12-16-15-7-3-15 3-21-2-6-5-2-14-7-19-5-5-14-2-17-9-3-7 4-13 3-20-1-8-10-11-10-19 0-8 9-11 10-19 1-7-6-13-3-20 3-7 12-7 16-13 4-6-1-15 4-20 5-5 14 0 20-4 6-4 4-14 11-16 6-2 12 5 19 4 7-1 10-10 18-9z"/></svg>';

  if (dateInput && !dateInput.value) {
    const today = new Date();
    const iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    dateInput.value = iso;
  }

  function formatDate(isoValue){
    if (!isoValue) {
      return new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
    }
    const parts = isoValue.split('-');
    const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
  }

  let spreads = [];
  let current = 0;
  let timer = null;
  const DURATIONS = [3800, 8200, 8200, 5200];

  function buildSpreads(prenom, nom, dateStr){
    const first = prenom.trim();
    const last = nom.trim();
    return [
      {
        left:  { html:`${AFRICA_SVG}<div class="eyebrow">Mot de bienvenue</div><h1 class="wordmark">SOLID</h1><div class="tagline">Solution Informatique Durable</div>`, num:1 },
        right: { html:`<div class="eyebrow">Chez SOLID SA</div><h2 class="greeting">Bonjour ${first},</h2><div class="date-line">Dakar, le ${dateStr}</div>`, num:2 }
      },
      {
        left:  { html:`<p>C'est avec un grand plaisir que la Direction Générale et tout le personnel de SOLID te souhaitent la bienvenue.</p><p>Nous sommes très heureux de te compter parmi l'équipe et la famille de SOLID SA.</p>`, num:3 },
        right: { html:`<p>Nous ferons tout ce qui est en notre pouvoir pour vous permettre d'évoluer dans un milieu dynamique et coopératif, où les relations interpersonnelles jouent un rôle important pour l'atteinte des objectifs stratégiques nécessaires à la croissance de l'entreprise.</p>`, num:4 }
      },
      {
        left:  { html:`<div class="closing">Encore une fois, soyez le bienvenu et plein succès à nos projets communs.</div><div class="team">Votre équipe de travail.</div>`, num:5 },
        right: { html:`<div class="signature-role">Président Directeur Général</div><div class="signature-name">Moustapha DIOP</div>`, num:6 }
      },
      {
        left:  { html:`${AFRICA_SVG}<div class="final-note">Bienvenue dans<br>l'aventure SOLID,</div>`, num:7 },
        right: { html:`<div class="final-note">${first} ${last}.</div><div class="date-line">${dateStr}</div>`, num:8 }
      }
    ];
  }

  function renderDots(){
    dotsWrap.innerHTML = '';
    spreads.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      dotsWrap.appendChild(d);
    });
  }

  function halfMarkup(side, data){
    return `<div class="page-half page-${side}"><div class="page-content">${data.html}</div><div class="page-number">${data.num} / ${spreads.length * 2}</div></div>`;
  }

  function renderSpread(index){
    const s = spreads[index];
    bookFrame.innerHTML = `<div class="book-spine"></div>${halfMarkup('left', s.left)}${halfMarkup('right', s.right)}`;
    renderDots();
    progressFill.style.width = (((index + 1) / spreads.length) * 100) + '%';
    prevBtn.disabled = false;
    nextBtn.disabled = false;
    restartWrap.classList.add('show');
  }

  function goTo(index, opts){
    opts = opts || {};
    const total = spreads.length;
    index = ((index % total) + total) % total;
    current = index;

    const rightPage = bookFrame.querySelector('.page-right');
    if (rightPage && !opts.instant){
      rightPage.classList.add('flipping');
      setTimeout(() => renderSpread(current), 550);
      setTimeout(() => {
        const np = bookFrame.querySelector('.page-right');
        if (np) np.classList.remove('flipping');
      }, 1150);
    } else {
      renderSpread(current);
    }

    if (!opts.manual) scheduleNext();
    else clearTimeout(timer);
  }

  function scheduleNext(){
    clearTimeout(timer);
    const duration = DURATIONS[current] || 6000;
    timer = setTimeout(() => {
      const next = (current + 1) % spreads.length;
      if (next === 0) {
        restartFromClosedCover();
      } else {
        goTo(next);
      }
    }, duration);
  }

  function restartFromClosedCover(){
    clearTimeout(timer);
    current = 0;
    renderSpread(0);
    openCover(() => {
      scheduleNext();
    });
  }

  function openCover(onDone){
    if (!bookCover) { onDone(); return; }

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    bookCover.style.display = 'flex';
    bookCover.classList.remove('opening');

    if (reduceMotion) {
      bookCover.style.display = 'none';
      onDone();
      return;
    }

    void bookCover.offsetWidth;

    const handleEnd = () => {
      bookCover.removeEventListener('animationend', handleEnd);
      bookCover.style.display = 'none';
      bookCover.classList.remove('opening');
      onDone();
    };
    bookCover.addEventListener('animationend', handleEnd);

    setTimeout(() => {
      bookCover.classList.add('opening');
    }, 650);
  }

  function startBook(prenom, nom, dateStr){
    spreads = buildSpreads(prenom, nom, dateStr);
    current = 0;
    if (formScreen) formScreen.classList.remove('active');
    bookScreen.classList.add('active');
    clearTimeout(timer);
    renderSpread(0);
    openCover(() => {
      scheduleNext();
    });
  }

  prevBtn.addEventListener('click', () => goTo(current - 1, { manual:true }));
  nextBtn.addEventListener('click', () => goTo(current + 1, { manual:true }));

  document.addEventListener('keydown', (e) => {
    if (!bookScreen.classList.contains('active')) return;
    if (e.key === 'ArrowRight') goTo(current + 1, { manual:true });
    if (e.key === 'ArrowLeft') goTo(current - 1, { manual:true });
  });

  function generateWelcomeFile(prenom, nom, dateStr){
    const first = prenom.trim();
    const last = nom.trim();
    const esc = s => s.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/</g,'\\u003C');

    const presetScript = `<script>window.SOLID_PRESET_NAME = { prenom: "${esc(first)}", nom: "${esc(last)}", date: "${esc(dateStr)}" };<\/script>`;

    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    // Supprimer le formulaire
    html = html.replace(/<section id="formScreen"[\s\S]*?<\/section>\s*/, '');
    // Supprimer complètement le bloc restart-wrap (bouton "Envoyer un nouveau message")
    html = html.replace(/<div class="restart-wrap" id="restartWrap"[\s\S]*?<\/div>/, '');
    // Supprimer aussi les éventuels espaces restants
    html = html.replace(/\s*<div class="restart-wrap"/, '');
    // Injecter le préréglage
    html = html.replace('<script>', presetScript + '\n<script>');

    const fileName = 'bienvenue-' + first.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-')
      + '-' + last.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-') + '.html';

    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const prenom = document.getElementById('prenom').value;
      const nom = document.getElementById('nom').value;
      const dateVal = dateInput ? dateInput.value : '';

      if (!prenom.trim() || !nom.trim() || !dateVal) {
        formError.classList.add('show');
        return;
      }
      formError.classList.remove('show');

      const dateStr = formatDate(dateVal);
      startBook(prenom, nom, dateStr);
      generateWelcomeFile(prenom, nom, dateStr);
    });
  }

  restartBtn.addEventListener('click', () => {
    if (!formScreen && window.SOLID_PRESET_NAME) {
      startBook(window.SOLID_PRESET_NAME.prenom, window.SOLID_PRESET_NAME.nom, window.SOLID_PRESET_NAME.date);
      return;
    }
    clearTimeout(timer);
    bookScreen.classList.remove('active');
    if (formScreen) formScreen.classList.add('active');
    if (form) form.reset();
    if (dateInput) {
      const today = new Date();
      dateInput.value = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    }
  });

  if (window.SOLID_PRESET_NAME && window.SOLID_PRESET_NAME.prenom && window.SOLID_PRESET_NAME.nom && window.SOLID_PRESET_NAME.date) {
    startBook(window.SOLID_PRESET_NAME.prenom, window.SOLID_PRESET_NAME.nom, window.SOLID_PRESET_NAME.date);
  }
})();
</script>

</body>
</html>
